<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media & Notes Manager</title>
    <style>
        /* ==========================================
           THEME COLORS - Aapke diye hue theme ke hisaab se
           ========================================== */
        
        :root {
            /* Main Colors */
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --accent-primary: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            
            /* Gradient Colors */
            --gradient-1: linear-gradient(45deg, #1a1a2e, #00d4ff);
            --gradient-2: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            
            /* Shadow Colors */
            --shadow-primary: 0 0 30px #00d4ff;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* ==========================================
           BACKGROUND STYLES
           ========================================== */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
        }

        /* Animated Background */
        .bg-animated {
            background: linear-gradient(-45deg, #1a1a2e, #16213e, #00d4ff, #1a1a2e);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ==========================================
           CONTAINER STYLES
           ========================================== */
        
        .container-modern {
            background: var(--bg-primary);
            border: 2px solid var(--accent-primary);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 30px var(--accent-primary);
            margin: 20px;
        }

        .container-glass {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid var(--accent-primary);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 30px var(--accent-primary);
        }

        /* ==========================================
           BUTTON STYLES
           ========================================== */
        
        .btn-primary {
            background: transparent;
            border: 2px solid var(--accent-primary);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            box-shadow: 0 0 20px var(--accent-primary);
        }

        .btn-glow {
            background: transparent;
            border: 2px solid var(--accent-primary);
            color: var(--text-primary);
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 20px var(--accent-primary);
            transition: all 0.3s ease;
        }

        .btn-glow:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            box-shadow: 0 0 40px var(--accent-primary);
        }

        .btn-gradient {
            background: linear-gradient(45deg, var(--bg-primary), var(--accent-primary));
            border: none;
            color: var(--text-primary);
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            background: linear-gradient(45deg, var(--accent-primary), var(--bg-primary));
            box-shadow: 0 0 30px var(--accent-primary);
        }

        /* Small action buttons */
        .btn-small {
            padding: 5px 10px;
            font-size: 14px;
            margin: 0 5px;
        }

        /* ==========================================
           CARD STYLES
           ========================================== */
        
        .card-hover {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-primary);
            border-radius: 10px;
            padding: 30px;
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 40px var(--accent-primary);
        }

        .folder-card {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-primary);
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .folder-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 40px var(--accent-primary);
        }

        .folder-icon {
            font-size: 48px;
            margin-bottom: 15px;
            color: var(--accent-primary);
        }

        .folder-title {
            font-size: 24px;
            color: var(--accent-primary);
            margin-bottom: 10px;
        }

        .project-card {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-primary);
            border-radius: 10px;
            padding: 20px;
            margin: 10px;
            width: 250px;
            position: relative;
        }

        .project-actions {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        /* ==========================================
           INPUT FIELD STYLES
           ========================================== */
        
        .input-modern {
            position: relative;
            margin-bottom: 25px;
        }

        .input-modern input,
        .input-modern textarea {
            width: 100%;
            padding: 10px 0;
            font-size: 16px;
            color: var(--text-primary);
            border: none;
            border-bottom: 2px solid var(--text-primary);
            outline: none;
            background: transparent;
            transition: all 0.3s ease;
        }

        .input-modern textarea {
            min-height: 100px;
            resize: vertical;
        }

        .input-modern input:focus,
        .input-modern textarea:focus,
        .input-modern input:valid,
        .input-modern textarea:valid {
            border-bottom-color: var(--accent-primary);
        }

        .input-modern label {
            position: absolute;
            top: 10px;
            left: 0;
            font-size: 16px;
            color: var(--text-primary);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .input-modern input:focus ~ label,
        .input-modern textarea:focus ~ label,
        .input-modern input:valid ~ label,
        .input-modern textarea:valid ~ label {
            top: -20px;
            font-size: 12px;
            color: var(--accent-primary);
        }

        .input-bordered input,
        .input-bordered textarea {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            color: var(--text-primary);
            background: transparent;
            border: 2px solid var(--text-primary);
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-bordered textarea {
            min-height: 150px;
            resize: vertical;
        }

        .input-bordered input:focus,
        .input-bordered textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ==========================================
           POPUP/MODAL STYLES
           ========================================== */
        
        .popup-modern {
            background: var(--bg-primary);
            border: 2px solid var(--accent-primary);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 30px var(--accent-primary);
            max-width: 500px;
            width: 90%;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
        }

        /* ==========================================
           GRID AND LAYOUT
           ========================================== */
        
        .folders-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 50px 0;
        }

        .projects-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .media-item {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-primary);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .media-item img,
        .media-item video {
            max-width: 100%;
            max-height: 200px;
            border-radius: 5px;
        }

        .pdf-item {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-primary);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        /* ==========================================
           TEXT COLORS
           ========================================== */
        
        .text-primary {
            color: var(--text-primary);
        }

        .text-accent {
            color: var(--accent-primary);
        }

        .text-gradient {
            background: linear-gradient(45deg, #ffffff, var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ==========================================
           UTILITY CLASSES
           ========================================== */
        
        .text-center {
            text-align: center;
        }

        .mt-4 {
            margin-top: 20px;
        }

        .mb-4 {
            margin-bottom: 20px;
        }

        .d-none {
            display: none;
        }

        .file-input {
            margin: 20px 0;
        }

        .file-input input[type="file"] {
            color: var(--text-primary);
        }

        .note-content {
            white-space: pre-wrap;
            text-align: left;
            margin: 15px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-animated">
    <!-- Main Container -->
    <div class="container-modern" style="max-width: 1200px; margin: 30px auto;">
        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="text-gradient" style="font-size: 48px;">📁 Media & Notes Manager</h1>
            <p class="text-secondary">Apne media, documents aur notes ko manage karein</p>
        </div>

        <!-- Three Folders Section -->
        <div id="foldersView" class="folders-container">
            <!-- Folder 1: Photos/Videos -->
            <div class="folder-card" onclick="openFolder('media')">
                <div class="folder-icon">📷</div>
                <h2 class="folder-title">Media Folder</h2>
                <p class="text-secondary">Photos & Videos</p>
                <p style="margin-top: 10px; font-size: 14px;">Upload, Download, Delete</p>
            </div>

            <!-- Folder 2: PDF/Documents -->
            <div class="folder-card" onclick="openFolder('documents')">
                <div class="folder-icon">📄</div>
                <h2 class="folder-title">Documents Folder</h2>
                <p class="text-secondary">PDFs & Documents</p>
                <p style="margin-top: 10px; font-size: 14px;">Upload, Download, Delete</p>
            </div>

            <!-- Folder 3: Text Notes -->
            <div class="folder-card" onclick="openFolder('notes')">
                <div class="folder-icon">📝</div>
                <h2 class="folder-title">Notes Folder</h2>
                <p class="text-secondary">Text Notes</p>
                <p style="margin-top: 10px; font-size: 14px;">Create, Edit, Delete</p>
            </div>
        </div>

        <!-- Projects View (Hidden by default) -->
        <div id="projectsView" class="d-none">
            <div class="text-center mb-4">
                <button class="btn-primary" onclick="showFolders()">← Back to Folders</button>
                <h2 class="text-gradient mt-4" id="folderTitle"></h2>
                <button class="btn-glow mt-4" onclick="showCreateProject()">+ Create New Project</button>
            </div>
            
            <!-- Projects Grid -->
            <div id="projectsGrid" class="projects-grid"></div>
        </div>

        <!-- Project Content View (Hidden by default) -->
        <div id="projectContentView" class="d-none">
            <div class="text-center mb-4">
                <button class="btn-primary" onclick="showProjects()">← Back to Projects</button>
                <h2 class="text-gradient mt-4" id="projectTitle"></h2>
            </div>
            
            <!-- Content Area -->
            <div id="contentArea" class="container-glass"></div>
        </div>

        <!-- Create Project Modal (Hidden by default) -->
        <div id="createProjectModal" class="d-none">
            <div class="overlay" onclick="hideCreateProject()"></div>
            <div class="popup-modern">
                <h2 class="text-accent mb-4">Create New Project</h2>
                <div class="input-modern">
                    <input type="text" id="projectNameInput" required>
                    <label>Project Name / Topic</label>
                </div>
                <div class="text-center">
                    <button class="btn-primary" onclick="createProject()">Create</button>
                    <button class="btn-primary" onclick="hideCreateProject()" style="margin-left: 10px;">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data Storage
        let currentFolder = '';
        let currentProject = '';
        let projects = {
            media: [],
            documents: [],
            notes: []
        };

        // Load data from localStorage
        function loadData() {
            const savedData = localStorage.getItem('mediaNotesManager');
            if (savedData) {
                projects = JSON.parse(savedData);
            }
        }

        // Save data to localStorage
        function saveData() {
            localStorage.setItem('mediaNotesManager', JSON.stringify(projects));
        }

        // Navigation Functions
        function openFolder(folderType) {
            currentFolder = folderType;
            let folderName = '';
            if (folderType === 'media') folderName = '📷 Media Projects';
            else if (folderType === 'documents') folderName = '📄 Documents Projects';
            else folderName = '📝 Notes Projects';
            
            document.getElementById('folderTitle').textContent = folderName;
            document.getElementById('foldersView').classList.add('d-none');
            document.getElementById('projectsView').classList.remove('d-none');
            displayProjects();
        }

        function showFolders() {
            document.getElementById('projectsView').classList.add('d-none');
            document.getElementById('foldersView').classList.remove('d-none');
            document.getElementById('projectContentView').classList.add('d-none');
        }

        function showProjects() {
            document.getElementById('projectContentView').classList.add('d-none');
            document.getElementById('projectsView').classList.remove('d-none');
        }

        function showCreateProject() {
            document.getElementById('createProjectModal').classList.remove('d-none');
        }

        function hideCreateProject() {
            document.getElementById('createProjectModal').classList.add('d-none');
            document.getElementById('projectNameInput').value = '';
        }

        // Project Functions
        function createProject() {
            const projectName = document.getElementById('projectNameInput').value.trim();
            if (projectName) {
                const projectId = Date.now().toString();
                projects[currentFolder].push({
                    id: projectId,
                    name: projectName,
                    content: [],
                    createdAt: new Date().toLocaleString()
                });
                saveData();
                hideCreateProject();
                displayProjects();
            }
        }

        function deleteProject(projectId) {
            if (confirm('Kya aap is project ko delete karna chahte hain?')) {
                projects[currentFolder] = projects[currentFolder].filter(p => p.id !== projectId);
                saveData();
                displayProjects();
            }
        }

        function openProject(projectId) {
            const project = projects[currentFolder].find(p => p.id === projectId);
            if (project) {
                currentProject = project;
                document.getElementById('projectTitle').textContent = project.name;
                document.getElementById('projectsView').classList.add('d-none');
                document.getElementById('projectContentView').classList.remove('d-none');
                displayProjectContent();
            }
        }

        function displayProjects() {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = '';
            
            projects[currentFolder].forEach(project => {
                const projectCard = document.createElement('div');
                projectCard.className = 'project-card card-hover';
                projectCard.innerHTML = `
                    <h3 class="text-accent">${project.name}</h3>
                    <p class="text-secondary" style="font-size: 12px;">Created: ${project.createdAt}</p>
                    <div class="project-actions">
                        <button class="btn-primary btn-small" onclick="openProject('${project.id}')">Open</button>
                        <button class="btn-primary btn-small" onclick="deleteProject('${project.id}')">Delete</button>
                    </div>
                `;
                grid.appendChild(projectCard);
            });
            
            if (projects[currentFolder].length === 0) {
                grid.innerHTML = '<p class="text-secondary">No projects yet. Create your first project!</p>';
            }
        }

        // Content Functions based on folder type
        function displayProjectContent() {
            const contentArea = document.getElementById('contentArea');
            
            if (currentFolder === 'media') {
                contentArea.innerHTML = `
                    <div class="text-center mb-4">
                        <div class="file-input">
                            <input type="file" id="mediaUpload" accept="image/*,video/*" multiple>
                            <button class="btn-glow" onclick="uploadMedia()">Upload</button>
                        </div>
                    </div>
                    <div id="mediaGrid" class="media-grid"></div>
                `;
                displayMediaItems();
            }
            else if (currentFolder === 'documents') {
                contentArea.innerHTML = `
                    <div class="text-center mb-4">
                        <div class="file-input">
                            <input type="file" id="documentUpload" accept=".pdf,.doc,.docx,.txt" multiple>
                            <button class="btn-glow" onclick="uploadDocument()">Upload</button>
                        </div>
                    </div>
                    <div id="documentsGrid" class="media-grid"></div>
                `;
                displayDocumentItems();
            }
            else if (currentFolder === 'notes') {
                contentArea.innerHTML = `
                    <div class="text-center mb-4">
                        <div class="input-bordered">
                            <textarea id="noteContent" placeholder="Type ya paste karein apna text yahan..."></textarea>
                        </div>
                        <button class="btn-glow" onclick="saveNote()">Save Note</button>
                        <button class="btn-primary" onclick="editNote()" style="margin-left: 10px;">Edit</button>
                    </div>
                    <div id="notesDisplay" class="container-glass">
                        <h3 class="text-accent">Saved Notes:</h3>
                        <div id="noteText" class="note-content"></div>
                    </div>
                `;
                displayNoteContent();
            }
        }

        // Media Functions
        function uploadMedia() {
            const files = document.getElementById('mediaUpload').files;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentProject.content.push({
                        id: Date.now() + Math.random(),
                        type: file.type.startsWith('image/') ? 'image' : 'video',
                        name: file.name,
                        data: e.target.result
                    });
                    saveData();
                    displayMediaItems();
                };
                reader.readAsDataURL(file);
            }
        }

        function displayMediaItems() {
            const mediaGrid = document.getElementById('mediaGrid');
            if (!mediaGrid) return;
            
            mediaGrid.innerHTML = '';
            currentProject.content.forEach(item => {
                const mediaItem = document.createElement('div');
                mediaItem.className = 'media-item';
                
                if (item.type === 'image') {
                    mediaItem.innerHTML = `
                        <img src="${item.data}" alt="${item.name}">
                        <p>${item.name}</p>
                        <div>
                            <a href="${item.data}" download="${item.name}" class="btn-primary btn-small">Download</a>
                            <button class="btn-primary btn-small" onclick="deleteMediaItem('${item.id}')">Delete</button>
                        </div>
                    `;
                } else {
                    mediaItem.innerHTML = `
                        <video src="${item.data}" controls></video>
                        <p>${item.name}</p>
                        <div>
                            <a href="${item.data}" download="${item.name}" class="btn-primary btn-small">Download</a>
                            <button class="btn-primary btn-small" onclick="deleteMediaItem('${item.id}')">Delete</button>
                        </div>
                    `;
                }
                mediaGrid.appendChild(mediaItem);
            });
        }

        // Document Functions
        function uploadDocument() {
            const files = document.getElementById('documentUpload').files;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentProject.content.push({
                        id: Date.now() + Math.random(),
                        type: 'document',
                        name: file.name,
                        data: e.target.result
                    });
                    saveData();
                    displayDocumentItems();
                };
                reader.readAsDataURL(file);
            }
        }

        function displayDocumentItems() {
            const documentsGrid = document.getElementById('documentsGrid');
            if (!documentsGrid) return;
            
            documentsGrid.innerHTML = '';
            currentProject.content.forEach(item => {
                const docItem = document.createElement('div');
                docItem.className = 'pdf-item';
                docItem.innerHTML = `
                    <div style="font-size: 48px;">📄</div>
                    <p>${item.name}</p>
                    <div style="margin-top: 10px;">
                        <a href="${item.data}" download="${item.name}" class="btn-primary btn-small">Download</a>
                        <button class="btn-primary btn-small" onclick="deleteMediaItem('${item.id}')">Delete</button>
                    </div>
                `;
                documentsGrid.appendChild(docItem);
            });
        }

        // Notes Functions
        function saveNote() {
            const noteContent = document.getElementById('noteContent').value;
            if (noteContent.trim()) {
                currentProject.content = [{
                    id: Date.now(),
                    type: 'note',
                    text: noteContent,
                    createdAt: new Date().toLocaleString()
                }];
                saveData();
                displayNoteContent();
                document.getElementById('noteContent').value = '';
            }
        }

        function editNote() {
            if (currentProject.content.length > 0) {
                document.getElementById('noteContent').value = currentProject.content[0].text;
            }
        }

        function displayNoteContent() {
            const noteText = document.getElementById('noteText');
            if (noteText && currentProject.content.length > 0) {
                noteText.textContent = currentProject.content[0].text;
            } else if (noteText) {
                noteText.textContent = 'No notes yet. Create your first note!';
            }
        }

        // Delete item
        function deleteMediaItem(itemId) {
            if (confirm('Kya aap is item ko delete karna chahte hain?')) {
                currentProject.content = currentProject.content.filter(item => item.id != itemId);
                saveData();
                displayProjectContent();
            }
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
